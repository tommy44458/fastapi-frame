services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_frame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fastapi_frame
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTO_CREATE_TABLES: "true"
      JWT_SECRET_KEY: dev-secret-change-me
      DEV: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
